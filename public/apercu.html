<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALEFLEH — Aperçu des visuels</title>
  <style>
    body { font-family: Arial, sans-serif; background: #141414; color: #fff; margin: 0; padding: 30px 20px; }
    h1 { text-align: center; color: #e07000; }
    h2 { color: #ffcf9e; margin: 30px 0 10px; }
    .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    figure { margin: 0; text-align: center; background: #1f1f1f; padding: 14px; border-radius: 12px; }
    figcaption { margin-top: 8px; color: #aaa; font-size: 14px; }
    img { max-width: 100%; border-radius: 8px; }
    .story { max-height: 620px; }
  </style>
</head>
<body>
  <h1>KALEFLEH — Aperçu des visuels de lancement</h1>

  <h2>Affiches</h2>
  <div class="grid">
    <figure><img src="affiche-carre.png" alt="Affiche carrée" width="480" /><figcaption>Affiche carrée (1080×1080) — posts FB/IG</figcaption></figure>
    <figure><img class="story" src="affiche-story.png" alt="Affiche story" width="270" /><figcaption>Affiche story (1080×1920) — Stories</figcaption></figure>
  </div>

  <h2>Carrousel « Comment ça marche »</h2>
  <div class="grid">
    <figure><img src="carrousel/slide-1.png" alt="Slide 1" width="300" /><figcaption>1. Cover</figcaption></figure>
    <figure><img src="carrousel/slide-2.png" alt="Slide 2" width="300" /><figcaption>2. Étape 1</figcaption></figure>
    <figure><img src="carrousel/slide-3.png" alt="Slide 3" width="300" /><figcaption>3. Étape 2</figcaption></figure>
    <figure><img src="carrousel/slide-4.png" alt="Slide 4" width="300" /><figcaption>4. Étape 3</figcaption></figure>
    <figure><img src="carrousel/slide-5.png" alt="Slide 5" width="300" /><figcaption>5. Étape 4</figcaption></figure>
    <figure><img src="carrousel/slide-6.png" alt="Slide 6" width="300" /><figcaption>6. CTA</figcaption></figure>
  </div>
</body>
</html>
