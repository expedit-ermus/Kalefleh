<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');
      .k { font-family:'Montserrat',Arial,sans-serif; }
      .b { font-family:'Inter',"Segoe UI",Arial,sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1208"/>
      <stop offset="0.55" stop-color="#3A1D00"/>
      <stop offset="1" stop-color="#5A2C00"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E86A00"/>
      <stop offset="1" stop-color="#FFA64D"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="970" cy="120" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="940" r="220" fill="#E86A00" opacity="0.12"/>
  <circle cx="1020" cy="820" r="90" fill="#ffffff" opacity="0.06"/>

  <rect x="340" y="70" width="400" height="96" rx="20" fill="#FFFFFF"/>
  <text x="540" y="135" class="k" font-size="56" font-weight="900" letter-spacing="6" fill="#E86A00" text-anchor="middle">KALEFLEH</text>

  <text x="540" y="222" class="k" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">Commande tout ce que tu veux,</text>
  <text x="540" y="276" class="k" font-size="40" font-weight="700" fill="#FFCF9E" text-anchor="middle">depuis l'étranger ou au pays. 🇨🇮</text>

  <rect x="410" y="330" width="260" height="8" rx="4" fill="url(#bar)"/>

  <text x="540" y="395" class="k" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">TU COMMANDES · NOUS ACHETONS · TU REÇOIS</text>
  <text x="540" y="442" class="b" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">👗 Vêtements · 💄 Cosmétiques · 💇🏾‍♀️ Perruques · 🛒 Alimentaire</text>

  <rect x="200" y="480" width="680" height="62" rx="14" fill="#FFFFFF" opacity="0.10"/>
  <text x="540" y="519" class="b" font-size="24" font-weight="400" fill="#FFD9A8" text-anchor="middle">🚫 On ne fait pas les documents administratifs</text>

  <text x="540" y="620" class="k" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">COMMENT ÇA MARCHE ?</text>
  <text x="540" y="690" class="b" font-size="26" font-weight="600" fill="#FFCF9E" text-anchor="middle">
    <tspan x="540" dy="0">1️⃣ Tu envoies ta demande</tspan>
    <tspan x="540" dy="44">2️⃣ On te calcule le devis : prestation + expédition</tspan>
    <tspan x="540" dy="44">3️⃣ On fait tes courses, photos + reçus 📸</tspan>
    <tspan x="540" dy="44">4️⃣ Expédition par ta compagnie ou via nous 📦</tspan>
  </text>

  <rect x="60" y="930" width="960" height="110" rx="20" fill="url(#bar)"/>
  <text x="540" y="975" class="k" font-size="34" font-weight="800" fill="#1C1208" text-anchor="middle">DEVIS EN 2 MINUTES</text>
  <text x="540" y="1022" class="b" font-size="24" font-weight="600" fill="#1C1208" text-anchor="middle">WhatsApp : [NUMERO_WHATSAPP]</text>
</svg>