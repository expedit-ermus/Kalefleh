<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#3a1d00"/>
      <stop offset="1" stop-color="#e07000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07000"/>
      <stop offset="1" stop-color="#ff9f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="970" cy="120" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="940" r="220" fill="#e07000" opacity="0.12"/>
  <circle cx="1020" cy="820" r="90" fill="#ffffff" opacity="0.06"/>

  <!-- Logo badge -->
  <rect x="340" y="70" width="400" height="96" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="540" y="135" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="6" fill="#e07000" text-anchor="middle">KALEFLEH</text>

  <!-- Tagline -->
  <text x="540" y="222" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Commande tout ce que tu veux,</text>
  <text x="540" y="276" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffcf9e" text-anchor="middle">depuis l'étranger ou au pays. 🇨🇮</text>

  <!-- Divider -->
  <rect x="410" y="330" width="260" height="8" rx="4" fill="url(#bar)"/>

  <!-- Services -->
  <text x="540" y="395" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">TU COMMANDES · NOUS ACHETONS · TU REÇOIS</text>
  <text x="540" y="442" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">👗 Vêtements · 💄 Cosmétiques · 💇🏾‍♀️ Perruques · 🛒 Alimentaire</text>

  <!-- Note -->
  <rect x="200" y="480" width="680" height="62" rx="14" fill="#ffffff" opacity="0.10"/>
  <text x="540" y="519" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#ffd9a8" text-anchor="middle">🚫 On ne fait pas les documents administratifs</text>

  <!-- Steps -->
  <text x="540" y="620" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">COMMENT ÇA MARCHE ?</text>

  <text x="540" y="690" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#ffcf9e" text-anchor="middle">
    <tspan x="540" dy="0">1️⃣ Tu envoies ta demande</tspan>
    <tspan x="540" dy="44">2️⃣ On te calcule le devis : prestation + expédition</tspan>
    <tspan x="540" dy="44">3️⃣ On fait tes courses, photos + reçus 📸</tspan>
    <tspan x="540" dy="44">4️⃣ Expédition par ta compagnie ou via nous 📦</tspan>
  </text>

  <!-- CTA bar -->
  <rect x="60" y="930" width="960" height="110" rx="20" fill="url(#bar)"/>
  <text x="540" y="975" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#1c1c1c" text-anchor="middle">DEVIS EN 2 MINUTES</text>
  <text x="540" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#1c1c1c" text-anchor="middle">WhatsApp : [NUMERO_WHATSAPP]</text>
</svg>