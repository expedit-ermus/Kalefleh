<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#3a1d00"/>
      <stop offset="1" stop-color="#e07000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07000"/>
      <stop offset="1" stop-color="#ff9f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="980" r="200" fill="#e07000" opacity="0.12"/>

  <text x="540" y="105" font-family="Arial" font-size="26" font-weight="700" letter-spacing="3" fill="#ffcf9e" text-anchor="middle">KALEFLEH</text>
  <rect x="210" y="145" width="660" height="74" rx="16" fill="url(#bar)"/>
  <text x="540" y="194" font-family="Arial" font-size="30" font-weight="800" fill="#1c1c1c" text-anchor="middle">ÉTAPE 2</text>

  <text x="540" y="330" font-family="Arial" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">On te calcule le devis</text>
  <text x="540" y="405" font-family="Arial" font-size="34" font-weight="600" fill="#ffcf9e" text-anchor="middle">Tout est clair avant de commencer.</text>
  <rect x="350" y="455" width="380" height="8" rx="4" fill="url(#bar)"/>

  <rect x="90" y="530" width="900" height="290" rx="22" fill="#ffffff" opacity="0.08"/>
  <text x="540" y="630" font-family="Arial" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">
    <tspan x='540' dy='0'>✅ Prestation KALEFLEH (déplacement)</tspan><tspan x='540' dy='52'>📦 + Expédition par ta compagnie</tspan><tspan x='540' dy='52'>💳 Ou on te propose les frais</tspan>
  </text>

  <rect x="330" y="940" width="420" height="90" rx="18" fill="url(#bar)"/>
  <text x="540" y="998" font-family="Arial" font-size="28" font-weight="800" fill="#1c1c1c" text-anchor="middle">Recevoir mon devis</text>
</svg>