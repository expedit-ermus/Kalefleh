    <tspan x='540' dy='0' class='b'>🚀 Ta compagnie favorite, direct</tspan><tspan x='540' dy='52' class='b'>🇨🇮 Ou livraison via KALEFLEH</tspan><tspan x='540' dy='52' class='b'>🎯 Suivi de l'expédition au bout du doigt</tspan>
  </text>

  <rect x="330" y="940" width="420" height="90" rx="18" fill="url(#bar)"/>
