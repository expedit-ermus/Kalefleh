  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="980" r="200" fill="#E86A00" opacity="0.12"/>

