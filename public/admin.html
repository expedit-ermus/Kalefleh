<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALEFLEH — Espace Admin</title>
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
    .admin-bar label { flex: 1; min-width: 200px; }
    .btn-secondary {
      padding: 12px 18px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      height: 44px;
    }
    .btn-secondary:hover { background: #3A2A17; }
    .fiche-card {
      border: 1px solid #e5d7c5;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fdfcfb;
    }
    .fiche-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ref { font-weight: 800; color: var(--primary-dark); }
    .date { color: var(--muted); font-size: .85rem; }
    .badge {
      background: var(--amber-tint);
      color: #7a3d00;
      font-size: .72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .fiche-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 18px; margin-top: 10px; font-size: .92rem; }
    .fiche-grid div span { color: var(--muted); }
    .types { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .type-tag { background: var(--dark); color: var(--amber-light); padding: 2px 10px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; }
    .login { max-width: 420px; margin: 40px auto; }
    .admin-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .admin-tools input[type="search"] {
      flex: 1; min-width: 200px; padding: 11px 14px;
      border: 1px solid #e5d7c5; border-radius: 10px; font-size: .92rem;
    }
    .admin-tools select {
      padding: 11px 14px; border: 1px solid #e5d7c5; border-radius: 10px;
      font-size: .92rem; background: #fff; cursor: pointer;
    }
    .fiche-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e5d7c5; }
    .statut-select { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .statut-select select { padding: 7px 10px; border: 1px solid #e5d7c5; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .wa-link { margin-left: auto; background: #25D366; color: #fff; padding: 8px 14px; border-radius: 9px; text-decoration: none; font-weight: 700; font-size: .85rem; }
    .wa-link:hover { background: #1ebe5b; }
    .btn-mini { padding: 7px 12px; border: 1px solid #e5d7c5; background: #fff; border-radius: 8px; font-size: .82rem; font-weight: 700; cursor: pointer; }
    .btn-mini:hover { background: #f5eee2; }
    .btn-mini.btn-danger { color: #a33; border-color: #ecc; }
    .btn-mini.btn-save { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn-mini.btn-save:hover { background: #3A2A17; }
    .fiche-edit { margin-top: 10px; padding: 12px; background: #faf6ef; border: 1px dashed #e5d7c5; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fiche-edit label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 4px; }
    .fiche-edit input, .fiche-edit textarea { padding: 8px 10px; border: 1px solid #e5d7c5; border-radius: 8px; font-size: .92rem; }
    .fiche-edit textarea { grid-column: 1 / -1; resize: vertical; }
    .fiche-edit .btn-save { justify-self: start; }
    .fiche-suivi { margin-top: 10px; padding: 12px; background: #fff; border: 1px solid #e5d7c5; border-radius: 10px; }
    .suivi-list { display: grid; gap: 8px; margin-bottom: 10px; max-height: 260px; overflow-y: auto; }
    .suivi-entry { background: #faf6ef; border-radius: 8px; padding: 8px 10px; font-size: .88rem; }
    .suivi-head { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .suivi-text { margin-top: 3px; }
    .suivi-badge { font-size: .66rem; font-weight: 800; padding: 1px 7px; border-radius: 10px; text-transform: uppercase; }
    .suivi-badge.vis-client { background: #d4edda; color: #155724; }
    .suivi-badge.vis-inte { background: #eee; color: #666; }
    .suivi-empty { color: var(--muted); font-size: .85rem; text-align: center; }
    .suivi-note { display: flex; flex-direction: column; gap: 8px; }
    .suivi-note textarea { padding: 8px 10px; border: 1px solid #e5d7c5; border-radius: 8px; font-size: .92rem; resize: vertical; }
    .suivi-note .suivi-vis { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
    .suivi-note .btn-save { align-self: flex-start; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat-chip { background: var(--dark); color: #fff; border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; line-height: 1.2; }
    .stat-chip b { font-size: 1.05rem; color: var(--amber-light); }
    .stat-chip span { font-size: .72rem; opacity: .8; text-transform: uppercase; }
    .stat-chip.stat-total { background: #7a3d00; }
    .stat-chip.stat-avance { background: #155724; }
    #newFicheBox { border: 2px dashed var(--primary); }
    .new-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
    .new-grid label, #newFicheBox > label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
    .new-grid input, .new-grid select, #newFicheBox textarea, #newFicheBox > label input {
      padding: 9px 11px; border: 1px solid #e5d7c5; border-radius: 8px; font-size: .92rem;
    }
    .new-grid textarea { resize: vertical; }
    .check-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-row .check { font-size: .88rem; color: #222; }
    .check-row .check input { margin-right: 4px; }
    @media (max-width: 640px) { .new-grid { grid-template-columns: 1fr; } }
    .badge.stat-NOUVEAU { background: var(--amber-tint); color: #7a3d00; }
    .badge.stat-CONTACT { background: #fff3cd; color: #856404; }
    .badge.stat-ENCOURS { background: #d1ecf1; color: #0c5460; }
    .badge.stat-EXPEDI { background: #cce5ff; color: #004085; }
    .badge.stat-TERMINE { background: #d4edda; color: #155724; }
    @media (max-width: 640px) { .fiche-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu</a>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo">KALEFLEH</div>
      <p class="tagline">Espace Admin — Fiches clients</p>
    </div>
  </header>

  <main class="wrap" id="main-content">
    <div class="card login" id="loginBox">
      <h2>Connexion</h2>
      <div class="admin-bar">
        <label>Mot de passe admin
          <input type="password" id="passInput" placeholder="Mot de passe" />
        </label>
        <button class="btn-secondary" id="btnLogin">Accéder</button>
      </div>
      <p id="loginMsg" class="form-status err"></p>
    </div>

    <div class="card" id="panelBox" style="display:none">
      <div class="admin-bar">
        <h2 style="margin:0;border:none;padding:0;text-transform:none">Fiches clients</h2>
        <span id="count" style="color:var(--muted)"></span>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-secondary" id="btnNew">+ Nouvelle fiche</button>
          <button class="btn-secondary" id="btnExport">Exporter CSV</button>
          <button class="btn-secondary" id="btnLogout">Déconnexion</button>
        </div>
      </div>
      <div class="card form-card" id="newFicheBox" hidden>
        <div class="admin-bar">
          <h3 style="margin:0;border:none;padding:0;text-transform:none">Nouvelle fiche (commande par WhatsApp / téléphone)</h3>
          <button class="btn-mini" id="btnNewClose" type="button">✕ Fermer</button>
        </div>
        <div class="new-grid">
          <label>Nom &amp; prénom <input type="text" id="nNom" required /></label>
          <label>Téléphone / WhatsApp <input type="tel" id="nTel" placeholder="+225 07 07 07 07 07" required /></label>
          <label>Email (facultatif) <input type="email" id="nEmail" placeholder="tou@exemple.com" /></label>
          <label>Pays <input type="text" id="nPays" placeholder="Côte d'Ivoire" /></label>
          <label>Ville <input type="text" id="nVille" placeholder="Abidjan" /></label>
        </div>
        <div class="new-grid">
          <label>Type(s) de course
            <div class="check-row">
              <label class="check"><input type="checkbox" class="nTypes" value="Vêtements" /> 👗 Vêtements</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Cosmétiques" /> 💄 Cosmétiques</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Perruques" /> 💇🏾‍♀️ Perruques</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Alimentaire" /> 🛒 Alimentaire</label>
            </div>
          </label>
          <label>Paiement
            <select id="nPaiement">
              <option value="">-- Choisir --</option>
              <option>Wave</option>
              <option>Orange Money</option>
              <option>MTN MoMo</option>
              <option>Moov Money</option>
              <option>Virement international (Western Union…)</option>
              <option>Espèces</option>
            </select>
          </label>
        </div>
        <div class="new-grid">
          <label>Budget (FCFA) <input type="number" id="nBudget" min="0" placeholder="0" /></label>
          <label>Avance reçue (FCFA) <input type="number" id="nAvance" min="0" placeholder="0" /></label>
          <label>Prestation (FCFA) <input type="number" id="nPrestation" min="0" placeholder="8000" /></label>
          <label>Délai souhaité
            <select id="nDelai">
              <option value="">-- Choisir --</option>
              <option>Pas d'urgence</option>
              <option>Cette semaine</option>
              <option>Sous 2 semaines</option>
              <option>Ce mois-ci</option>
            </select>
          </label>
        </div>
        <label class="full">Adresse de livraison <input type="text" id="nAdresse" placeholder="Pays + ville + quartier" /></label>
        <label class="full">Détail de la course / commentaire <textarea id="nCommentaire" rows="2"></textarea></label>
        <div class="admin-bar">
          <button class="btn-mini btn-save" id="btnNewSave">💾 Enregistrer la fiche</button>
          <span id="newMsg" class="form-status"></span>
        </div>
      </div>
      <div class="admin-tools">
        <input type="search" id="searchInput" placeholder="Rechercher (nom, téléphone, réf)…" />
        <select id="statutFilter">
          <option value="">Tous les statuts</option>
          <option>NOUVEAU</option>
          <option>CONTACTÉ</option>
          <option>EN COURS</option>
          <option>EXPÉDIÉ</option>
          <option>TERMINÉ</option>
        </select>
      </div>
      <div class="stats" id="statsBox" hidden></div>
      <div id="fiches"></div>
    </div>
  </main>

  <footer class="footer">
    <p><strong>KALEFLEH</strong> — Espace Admin</p>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
