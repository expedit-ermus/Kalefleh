<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALEFLEH — Espace Admin</title>
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
    .admin-bar label { flex: 1; min-width: 200px; }
    .btn-secondary {
      padding: 12px 18px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      height: 44px;
    }
    .btn-secondary:hover { background: #3A2A17; }
    .fiche-card {
      border: 1px solid #e5d7c5;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fdfcfb;
    }
    .fiche-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ref { font-weight: 800; color: var(--primary-dark); }
    .date { color: var(--muted); font-size: .85rem; }
    .badge {
      background: var(--amber-tint);
      color: #7a3d00;
      font-size: .72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .fiche-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 18px; margin-top: 10px; font-size: .92rem; }
    .fiche-grid div span { color: var(--muted); }
    .types { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .type-tag { background: var(--dark); color: var(--amber-light); padding: 2px 10px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; }
    .login { max-width: 420px; margin: 40px auto; }
    .admin-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .admin-tools input[type="search"] {
      flex: 1; min-width: 200px; padding: 11px 14px;
      border: 1px solid #e5d7c5; border-radius: 10px; font-size: .92rem;
    }
    .admin-tools select {
      padding: 11px 14px; border: 1px solid #e5d7c5; border-radius: 10px;
      font-size: .92rem; background: #fff; cursor: pointer;
    }
    .fiche-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e5d7c5; }
    .statut-select { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .statut-select select { padding: 7px 10px; border: 1px solid #e5d7c5; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .wa-link { margin-left: auto; background: #25D366; color: #fff; padding: 8px 14px; border-radius: 9px; text-decoration: none; font-weight: 700; font-size: .85rem; }
    .wa-link:hover { background: #1ebe5b; }
    .btn-mini { padding: 7px 12px; border: 1px solid #e5d7c5; background: #fff; border-radius: 8px; font-size: .82rem; font-weight: 700; cursor: pointer; }
    .btn-mini:hover { background: #f5eee2; }
    .btn-mini.btn-danger { color: #a33; border-color: #ecc; }
    .btn-mini.btn-save { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn-mini.btn-save:hover { background: #3A2A17; }
    .fiche-edit { margin-top: 10px; padding: 12px; background: #faf6ef; border: 1px dashed #e5d7c5; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fiche-edit label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 4px; }
    .fiche-edit input, .fiche-edit textarea { padding: 8px 10px; border: 1px solid #e5d7c5; border-radius: 8px; font-size: .92rem; }
    .fiche-edit textarea { grid-column: 1 / -1; resize: vertical; }
    .fiche-edit .btn-save { justify-self: start; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat-chip { background: var(--dark); color: #fff; border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; line-height: 1.2; }
    .stat-chip b { font-size: 1.05rem; color: var(--amber-light); }
    .stat-chip span { font-size: .72rem; opacity: .8; text-transform: uppercase; }
    .stat-chip.stat-total { background: #7a3d00; }
    .stat-chip.stat-avance { background: #155724; }
    #newFicheBox { border: 2px dashed var(--primary); }
    .new-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
    .new-grid label, #newFicheBox > label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
    .new-grid input, .new-grid select, #newFicheBox textarea, #newFicheBox > label input {
      padding: 9px 11px; border: 1px solid #e5d7c5; border-radius: 8px; font-size: .92rem;
    }
    .new-grid textarea { resize: vertical; }
    .check-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-row .check { font-size: .88rem; color: #222; }
    .check-row .check input { margin-right: 4px; }
    @media (max-width: 640px) { .new-grid { grid-template-columns: 1fr; } }
    .badge.stat-NOUVEAU { background: var(--amber-tint); color: #7a3d00; }
    .badge.stat-CONTACT { background: #fff3cd; color: #856404; }
    .badge.stat-ENCOURS { background: #d1ecf1; color: #0c5460; }
    .badge.stat-EXPEDI { background: #cce5ff; color: #004085; }
    .badge.stat-TERMINE { background: #d4edda; color: #155724; }
    @media (max-width: 640px) { .fiche-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo">KALEFLEH</div>
      <p class="tagline">Espace Admin — Fiches clients</p>
    </div>
  </header>

  <main class="wrap">
    <div class="card login" id="loginBox">
      <h2>Connexion</h2>
      <div class="admin-bar">
        <label>Mot de passe admin
          <input type="password" id="passInput" placeholder="Mot de passe" />
        </label>
        <button class="btn-secondary" id="btnLogin">Accéder</button>
      </div>
      <p id="loginMsg" class="form-status err"></p>
    </div>

    <div class="card" id="panelBox" style="display:none">
      <div class="admin-bar">
        <h2 style="margin:0;border:none;padding:0;text-transform:none">Fiches clients</h2>
        <span id="count" style="color:var(--muted)"></span>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-secondary" id="btnNew">+ Nouvelle fiche</button>
          <button class="btn-secondary" id="btnExport">Exporter CSV</button>
          <button class="btn-secondary" id="btnLogout">Déconnexion</button>
        </div>
      </div>
      <div class="card form-card" id="newFicheBox" hidden>
        <div class="admin-bar">
          <h3 style="margin:0;border:none;padding:0;text-transform:none">Nouvelle fiche (commande par WhatsApp / téléphone)</h3>
          <button class="btn-mini" id="btnNewClose" type="button">✕ Fermer</button>
        </div>
        <div class="new-grid">
          <label>Nom &amp; prénom <input type="text" id="nNom" required /></label>
          <label>Téléphone / WhatsApp <input type="tel" id="nTel" placeholder="+225 07 07 07 07 07" required /></label>
          <label>Pays <input type="text" id="nPays" placeholder="Côte d'Ivoire" /></label>
          <label>Ville <input type="text" id="nVille" placeholder="Abidjan" /></label>
        </div>
        <div class="new-grid">
          <label>Type(s) de course
            <div class="check-row">
              <label class="check"><input type="checkbox" class="nTypes" value="Vêtements" /> 👗 Vêtements</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Cosmétiques" /> 💄 Cosmétiques</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Perruques" /> 💇🏾‍♀️ Perruques</label>
              <label class="check"><input type="checkbox" class="nTypes" value="Alimentaire" /> 🛒 Alimentaire</label>
            </div>
          </label>
          <label>Paiement
            <select id="nPaiement">
              <option value="">-- Choisir --</option>
              <option>Wave</option>
              <option>Orange Money</option>
              <option>MTN MoMo</option>
              <option>Moov Money</option>
              <option>Virement international (Western Union…)</option>
              <option>Espèces</option>
            </select>
          </label>
        </div>
        <div class="new-grid">
          <label>Budget (FCFA) <input type="number" id="nBudget" min="0" placeholder="0" /></label>
          <label>Avance reçue (FCFA) <input type="number" id="nAvance" min="0" placeholder="0" /></label>
          <label>Prestation (FCFA) <input type="number" id="nPrestation" min="0" placeholder="8000" /></label>
          <label>Délai souhaité
            <select id="nDelai">
              <option value="">-- Choisir --</option>
              <option>Pas d'urgence</option>
              <option>Cette semaine</option>
              <option>Sous 2 semaines</option>
              <option>Ce mois-ci</option>
            </select>
          </label>
        </div>
        <label class="full">Adresse de livraison <input type="text" id="nAdresse" placeholder="Pays + ville + quartier" /></label>
        <label class="full">Détail de la course / commentaire <textarea id="nCommentaire" rows="2"></textarea></label>
        <div class="admin-bar">
          <button class="btn-mini btn-save" id="btnNewSave">💾 Enregistrer la fiche</button>
          <span id="newMsg" class="form-status"></span>
        </div>
      </div>
      <div class="admin-tools">
        <input type="search" id="searchInput" placeholder="Rechercher (nom, téléphone, réf)…" />
        <select id="statutFilter">
          <option value="">Tous les statuts</option>
          <option>NOUVEAU</option>
          <option>CONTACTÉ</option>
          <option>EN COURS</option>
          <option>EXPÉDIÉ</option>
          <option>TERMINÉ</option>
        </select>
      </div>
      <div class="stats" id="statsBox" hidden></div>
      <div id="fiches"></div>
    </div>
  </main>

  <footer class="footer">
    <p><strong>KALEFLEH</strong> — Espace Admin</p>
  </footer>

  <script>
    var pass = sessionStorage.getItem("kf_pass") || "";
    var panelBox = document.getElementById("panelBox");
    var loginBox = document.getElementById("loginBox");
    var loginMsg = document.getElementById("loginMsg");
    var allFiches = [];
    var searchInput = document.getElementById("searchInput");
    var statutFilter = document.getElementById("statutFilter");
    var STATUTS = ["NOUVEAU", "CONTACTÉ", "EN COURS", "EXPÉDIÉ", "TERMINÉ"];

    function showPanel() {
      loginBox.style.display = "none";
      panelBox.style.display = "";
      loadFiches();
    }

    async function loadFiches() {
      var holder = document.getElementById("fiches");
      holder.innerHTML = '<p class="empty">Chargement...</p>';
      try {
        var res = await fetch("/api/fiches?pass=" + encodeURIComponent(pass));
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Accès refusé.");
        allFiches = data.fiches || [];
        document.getElementById("count").textContent = allFiches.length + " fiche(s)";
        renderStats();
        renderFiches();
      } catch (err) {
        holder.innerHTML = '<p class="empty">' + esc(err.message) + "</p>";
      }
    }

    function renderStats() {
      var box = document.getElementById("statsBox");
      if (!allFiches.length) { box.hidden = true; return; }
      var byStatut = {};
      var totalEstime = 0;
      var totalAvance = 0;
      allFiches.forEach(function (f) {
        byStatut[f.statut] = (byStatut[f.statut] || 0) + 1;
        totalEstime += Number(f.total_estime_fcfa) || 0;
        totalAvance += Number(f.avance_fcfa) || 0;
      });
      var html = '<div class="stat-chip"><b>' + allFiches.length + '</b><span>fiches</span></div>';
      STATUTS.forEach(function (s) {
        if (byStatut[s]) html += '<div class="stat-chip"><b>' + byStatut[s] + '</b><span>' + s.toLowerCase() + '</span></div>';
      });
      html += '<div class="stat-chip stat-total"><b>' + money(totalEstime) + '</b><span>total estimé</span></div>';
      if (totalAvance > 0) html += '<div class="stat-chip stat-avance"><b>' + money(totalAvance) + '</b><span>avances reçues</span></div>';
      box.innerHTML = html;
      box.hidden = false;
    }

    function renderFiches() {
      var holder = document.getElementById("fiches");
      var q = (searchInput.value || "").trim().toLowerCase();
      var sf = statutFilter.value;
      var rows = allFiches.filter(function (f) {
        if (sf && f.statut !== sf) return false;
        if (!q) return true;
        return (f.nom_client + " " + f.telephone + " " + f.ref + " " + f.pays + " " + f.ville).toLowerCase().indexOf(q) !== -1;
      });

      holder.innerHTML = "";
      if (!rows.length) { holder.innerHTML = '<p class="empty">Aucune fiche.</p>'; return; }

      rows.forEach(function (f) {
        var el = document.createElement("div");
        el.className = "fiche-card";
        el.innerHTML =
          '<div class="fiche-head"><span class="ref">' + esc(f.ref) + '</span>' +
          '<span class="badge stat-' + esc(f.statut.replace(/\s/g, "")) + '">' + esc(f.statut) + '</span>' +
          '<span class="date">' + esc(new Date(f.date).toLocaleString("fr-FR")) + '</span></div>' +
          '<div class="types">' + f.types_courses.map(function (t) { return '<span class="type-tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
          '<div class="fiche-grid">' +
          cell("Client", f.nom_client) + cell("Téléphone", f.telephone) +
          cell("WhatsApp", f.whatsapp) + cell("Pays / Ville", f.pays + " — " + f.ville) +
          cell("Budget", money(f.budget_fcfa)) + cell("Prestation", money(f.prestation_fcfa)) +
          cell("Expédition", money(f.expedition_fcfa)) + cell("Total estimé", money(f.total_estime_fcfa)) +
          cell("Avance", money(f.avance_fcfa)) + cell("Paiement", f.paiement) +
          cell("Compagnie", f.compagnie_expedition) + cell("Livraison", f.adresse_livraison) +
          cell("Détail course", f.details_course) + cell("Commentaire", f.commentaire) +
          '</div>' +
          '<div class="fiche-actions">' +
          '<label class="statut-select">Statut : ' +
          '<select data-ref="' + esc(f.ref) + '">' + STATUTS.map(function (s) {
            return '<option' + (s === f.statut ? " selected" : "") + '>' + esc(s) + '</option>';
          }).join("") + "</select></label>" +
          (f.whatsapp ? '<a class="wa-link" href="https://wa.me/' + f.whatsapp.replace(/\D/g, "") + '" target="_blank" rel="noopener">💬 WhatsApp</a>' : "") +
          '<button class="btn-mini" data-action="edit" data-ref="' + esc(f.ref) + '">✏️ Modifier</button>' +
          '<button class="btn-mini btn-danger" data-action="delete" data-ref="' + esc(f.ref) + '">🗑️</button>' +
          "</div>" +
          '<div class="fiche-edit" id="edit-' + esc(f.ref) + '" hidden>' +
          '<label>Avance versée (FCFA)<input type="number" class="e-avance" min="0" value="' + (Number(f.avance_fcfa) || 0) + '" /></label>' +
          '<label>Total estimé (FCFA)<input type="number" class="e-total" min="0" value="' + (Number(f.total_estime_fcfa) || 0) + '" /></label>' +
          '<label>Commentaire<textarea class="e-com" rows="2">' + esc(f.commentaire || "") + '</textarea></label>' +
          '<button class="btn-mini btn-save" data-ref="' + esc(f.ref) + '">💾 Enregistrer</button>' +
          "</div>";
        holder.appendChild(el);

        var sel = el.querySelector('select[data-ref]');
        sel.addEventListener("change", function () { updateStatut(f.ref, sel.value); });

        el.querySelector('[data-action="edit"]').addEventListener("click", function () {
          var box = document.getElementById("edit-" + f.ref);
          box.hidden = !box.hidden;
        });

        el.querySelector('[data-action="delete"]').addEventListener("click", function () {
          if (confirm("Supprimer définitivement la fiche " + f.ref + " (" + f.nom_client + ") ?")) {
            deleteFiche(f.ref);
          }
        });

        el.querySelector(".btn-save").addEventListener("click", function () {
          var payload = {
            avance_fcfa: Number(el.querySelector(".e-avance").value) || 0,
            total_estime_fcfa: Number(el.querySelector(".e-total").value) || 0,
            commentaire: el.querySelector(".e-com").value
          };
          updateFiche(f.ref, payload);
        });
      });
    }

    async function updateStatut(ref, statut) {
      try {
        var res = await fetch("/api/fiches/" + encodeURIComponent(ref) + "?pass=" + encodeURIComponent(pass), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ statut: statut })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur.");
        loadFiches();
      } catch (err) {
        alert("Erreur changement de statut : " + err.message);
        loadFiches();
      }
    }

    async function updateFiche(ref, payload) {
      try {
        var res = await fetch("/api/fiches/" + encodeURIComponent(ref) + "?pass=" + encodeURIComponent(pass), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur.");
        loadFiches();
      } catch (err) {
        alert("Erreur modification : " + err.message);
      }
    }

    async function deleteFiche(ref) {
      try {
        var res = await fetch("/api/fiches/" + encodeURIComponent(ref) + "?pass=" + encodeURIComponent(pass), {
          method: "DELETE"
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur.");
        loadFiches();
      } catch (err) {
        alert("Erreur suppression : " + err.message);
      }
    }

    searchInput.addEventListener("input", renderFiches);
    statutFilter.addEventListener("change", renderFiches);

    var newFicheBox = document.getElementById("newFicheBox");
    function resetNewForm() {
      ["nNom", "nTel", "nPays", "nVille", "nBudget", "nAvance", "nPrestation", "nAdresse", "nCommentaire"].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.value = "";
      });
      ["nPaiement", "nDelai"].forEach(function (id) { document.getElementById(id).value = ""; });
      Array.from(document.querySelectorAll(".nTypes")).forEach(function (c) { c.checked = false; });
      document.getElementById("newMsg").textContent = "";
    }

    document.getElementById("btnNew").onclick = function () {
      newFicheBox.hidden = !newFicheBox.hidden;
      if (!newFicheBox.hidden) resetNewForm();
    };
    document.getElementById("btnNewClose").onclick = function () { newFicheBox.hidden = true; };

    document.getElementById("btnNewSave").onclick = async function () {
      var nom = document.getElementById("nNom").value.trim();
      var tel = document.getElementById("nTel").value.trim();
      var msg = document.getElementById("newMsg");
      if (!nom || !tel) { msg.className = "form-status err"; msg.textContent = "Nom et téléphone obligatoires."; return; }
      var types = Array.from(document.querySelectorAll(".nTypes")).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
      var budget = Number(document.getElementById("nBudget").value) || 0;
      var avance = Number(document.getElementById("nAvance").value) || 0;
      var prestation = Number(document.getElementById("nPrestation").value) || 0;
      var total = budget + prestation;
      var payload = {
        nomClient: nom,
        telephone: tel,
        whatsapp: tel,
        pays: document.getElementById("nPays").value.trim() || "Côte d'Ivoire",
        ville: document.getElementById("nVille").value.trim() || "Abidjan",
        typesCourses: types,
        budgetFcfa: budget,
        prestationFcfa: prestation,
        expeditionFcfa: 0,
        totalEstimeFcfa: total,
        avanceFcfa: avance,
        paiement: document.getElementById("nPaiement").value,
        compagnieExpedition: "KALEFLEH s'occupe de tout",
        adresseLivraison: document.getElementById("nAdresse").value.trim(),
        delaiSouhaite: document.getElementById("nDelai").value,
        commentaire: document.getElementById("nCommentaire").value.trim()
      };
      try {
        var res = await fetch("/api/fiches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur.");
        msg.className = "form-status ok";
        msg.textContent = "Fiche " + data.fiche.ref + " enregistrée ✓";
        newFicheBox.hidden = true;
        loadFiches();
      } catch (err) {
        msg.className = "form-status err";
        msg.textContent = "Erreur : " + err.message;
      }
    };

    function cell(name, val) {
      return "<div><span>" + esc(name) + " :</span> " + esc(val || "—") + "</div>";
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function money(v) { return new Intl.NumberFormat("fr-FR").format(Number(v) || 0) + " FCFA"; }

    document.getElementById("btnLogin").onclick = async function () {
      var v = document.getElementById("passInput").value.trim().toUpperCase();
      if (!v) { loginMsg.textContent = "Entrez un mot de passe."; return; }
      var res = await fetch("/api/fiches?pass=" + encodeURIComponent(v));
      if (res.status === 401) { loginMsg.textContent = "Mot de passe incorrect."; return; }
      pass = v;
      sessionStorage.setItem("kf_pass", pass);
      showPanel();
    };

    document.getElementById("btnExport").onclick = function () {
      window.location.href = "/api/export/fiches.csv?pass=" + encodeURIComponent(pass);
    };

    document.getElementById("btnLogout").onclick = function () {
      sessionStorage.removeItem("kf_pass");
      pass = "";
      location.reload();
    };

    if (pass) showPanel();
    else document.getElementById("passInput").focus();
  </script>
</body>
</html>
