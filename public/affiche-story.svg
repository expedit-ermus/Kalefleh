<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.5" stop-color="#3a1d00"/>
      <stop offset="1" stop-color="#e07000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07000"/>
      <stop offset="1" stop-color="#ff9f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Decorative -->
  <circle cx="980" cy="160" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="1750" r="260" fill="#e07000" opacity="0.12"/>
  <circle cx="1020" cy="1500" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- Logo -->
  <rect x="250" y="90" width="580" height="120" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="540" y="172" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="8" fill="#e07000" text-anchor="middle">KALEFLEH</text>

  <!-- Tagline -->
  <text x="540" y="320" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle">À l'étranger ou au pays,</text>
  <text x="540" y="388" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" fill="#ffcf9e" text-anchor="middle">passe ta commande 🇨🇮</text>
  <text x="540" y="458" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#ffffff" text-anchor="middle">on fait tes courses</text>
  <text x="540" y="514" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#ffffff" text-anchor="middle">à ta place. ✅</text>

  <rect x="390" y="600" width="300" height="8" rx="4" fill="url(#bar)"/>

  <!-- Services (grands) -->
  <text x="540" y="700" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">👗  VÊTEMENTS</text>
  <text x="540" y="770" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">💄  COSMÉTIQUES (réglementés)</text>
  <text x="540" y="840" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">💇🏾♀️  PERRUQUES</text>
  <text x="540" y="910" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">🛒  ALIMENTAIRE</text>

  <!-- Note -->
  <rect x="140" y="960" width="800" height="70" rx="14" fill="#ffffff" opacity="0.10"/>
  <text x="540" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#ffd9a8" text-anchor="middle">🚫 On ne fait pas les documents administratifs</text>

  <!-- Steps -->
  <text x="540" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">COMMENT ÇA MARCHE ?</text>
  <text x="540" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#ffcf9e" text-anchor="middle">
    <tspan x="540" dy="0">1️⃣ Tu commandes (même depuis l'étranger)</tspan>
    <tspan x="540" dy="52">2️⃣ On te calcule : prestation + expédition</tspan>
    <tspan x="540" dy="52">3️⃣ Courses faites, photos + reçus 📸</tspan>
    <tspan x="540" dy="52">4️⃣ Expédition par ta compagnie ou via nous 📦</tspan>
  </text>

  <!-- CTA -->
  <rect x="60" y="1530" width="960" height="300" rx="24" fill="url(#bar)"/>
  <text x="540" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#1c1c1c" text-anchor="middle">DEVIS EN 2 MINUTES</text>
  <text x="540" y="1715" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1c1c1c" text-anchor="middle">🔗 [LIEN_DEVIS]</text>
  <text x="540" y="1785" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1c1c1c" text-anchor="middle">📞 WhatsApp : [NUMERO_WHATSAPP]</text>
</svg>