<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');
      .k { font-family:'Montserrat',Arial,sans-serif; }
      .b { font-family:'Inter',"Segoe UI",Arial,sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1208"/>
      <stop offset="0.5" stop-color="#3A1D00"/>
      <stop offset="1" stop-color="#5A2C00"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E86A00"/>
      <stop offset="1" stop-color="#FFA64D"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="980" cy="160" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="1750" r="260" fill="#E86A00" opacity="0.12"/>
  <circle cx="1020" cy="1500" r="120" fill="#ffffff" opacity="0.06"/>

  <rect x="250" y="90" width="580" height="120" rx="22" fill="#FFFFFF"/>
  <text x="540" y="172" class="k" font-size="66" font-weight="900" letter-spacing="8" fill="#E86A00" text-anchor="middle">KALEFLEH</text>

  <text x="540" y="320" class="k" font-size="50" font-weight="800" fill="#FFFFFF" text-anchor="middle">À l'étranger ou au pays,</text>
  <text x="540" y="388" class="k" font-size="50" font-weight="800" fill="#FFCF9E" text-anchor="middle">passe ta commande 🇨🇮</text>
  <text x="540" y="458" class="b" font-size="42" font-weight="600" fill="#FFFFFF" text-anchor="middle">on fait tes courses</text>
  <text x="540" y="514" class="b" font-size="42" font-weight="600" fill="#FFFFFF" text-anchor="middle">à ta place. ✅</text>

  <rect x="390" y="600" width="300" height="8" rx="4" fill="url(#bar)"/>

  <text x="540" y="700" class="k" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">👗  VÊTEMENTS</text>
  <text x="540" y="770" class="k" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">💄  COSMÉTIQUES (réglementés)</text>
  <text x="540" y="840" class="k" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">💇🏾‍♀️  PERRUQUES</text>
  <text x="540" y="910" class="k" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">🛒  ALIMENTAIRE</text>

  <rect x="140" y="960" width="800" height="70" rx="14" fill="#FFFFFF" opacity="0.10"/>
  <text x="540" y="1006" class="b" font-size="26" font-weight="400" fill="#FFD9A8" text-anchor="middle">🚫 On ne fait pas les documents administratifs</text>

  <text x="540" y="1130" class="k" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">COMMENT ÇA MARCHE ?</text>
  <text x="540" y="1215" class="b" font-size="30" font-weight="600" fill="#FFCF9E" text-anchor="middle">
    <tspan x="540" dy="0">1️⃣ Tu commandes (même depuis l'étranger)</tspan>
    <tspan x="540" dy="52">2️⃣ On te calcule : prestation + expédition</tspan>
    <tspan x="540" dy="52">3️⃣ Courses faites, photos + reçus 📸</tspan>
    <tspan x="540" dy="52">4️⃣ Expédition par ta compagnie ou via nous 📦</tspan>
  </text>

  <rect x="60" y="1530" width="960" height="300" rx="24" fill="url(#bar)"/>
  <text x="540" y="1640" class="k" font-size="48" font-weight="900" fill="#1C1208" text-anchor="middle">DEVIS EN 2 MINUTES</text>
  <text x="540" y="1715" class="k" font-size="30" font-weight="700" fill="#1C1208" text-anchor="middle">🔗 kalefleh.vercel.app</text>
  <text x="540" y="1785" class="b" font-size="30" font-weight="700" fill="#1C1208" text-anchor="middle">📞 WhatsApp : [NUMERO_WHATSAPP]</text>
</svg>